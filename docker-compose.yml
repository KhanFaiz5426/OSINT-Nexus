services:
  postgres:
    image: postgres:16-alpine
    container_name: osint-nexus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osintnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osintnexus_dev}
      POSTGRES_DB: ${POSTGRES_DB:-osintnexus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osintnexus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osint-nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: osint-nexus-backend
    init: true
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://frontend:80"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - reports_output:/app/reports_output
      - settings_data:/app/data
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
    container_name: osint-nexus-celery
    init: true
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://frontend:80"]
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--queues=osint,ai,reports"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - reports_output:/app/reports_output
      - settings_data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: osint-nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    stop_signal: SIGQUIT
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: osint-nexus-searxng
    profiles: ["searxng"]
    ports:
      - "8088:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
      - SEARXNG_FORMATS=html,json
    volumes:
      - ./searxng_settings.yml:/etc/searxng/settings.yml
      - searxng_data:/etc/searxng
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  reports_output:
  settings_data:
  searxng_data:

