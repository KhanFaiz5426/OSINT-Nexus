services:
  postgres:
    image: postgres:16-alpine
    container_name: osint-nexus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osintnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osintnexus_dev}
      POSTGRES_DB: ${POSTGRES_DB:-osintnexus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osintnexus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: osint-nexus-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-osintnexus_dev}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osint-nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: osint-nexus-backend
    init: true
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://frontend:80"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - reports_output:/app/reports_output
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
    container_name: osint-nexus-celery
    init: true
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://frontend:80"]
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--queues=osint,ai,reports"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - reports_output:/app/reports_output

  frontend:
    build:
      context: ./frontend
    container_name: osint-nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    stop_signal: SIGQUIT
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  reports_output:
