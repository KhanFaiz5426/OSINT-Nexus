[project]
name = "osint-nexus-backend"
version = "0.1.0"
description = "OSINT Nexus: AI-Assisted OSINT Investigation and Correlation Framework"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
