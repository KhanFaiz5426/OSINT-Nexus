<style>
  :root {
    --color-primary: #1e293b; /* Slate 800 */
    --color-primary-light: #475569; /* Slate 600 */
    --color-accent: #0f172a; /* Slate 900 */
    --color-text: #1e293b;
    --color-text-secondary: #475569;
    --color-text-muted: #64748b;
    --color-border: #cbd5e1;
    --color-bg: #ffffff;
    --color-bg-alt: #f8fafc;
    --color-bg-accent: #f1f5f9;
    --color-success: #059669;
    --color-warning: #d97706;
    --color-danger: #dc2626;
    --color-critical: #991b1b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--color-text);
    background: var(--color-bg);
    line-height: 1.6;
    font-size: 13px;
  }

  .report-container {
    max-width: 850px;
    margin: 0 auto;
    padding: 40px 40px;
  }

  /* Header styles */
  .header-block {
    border-bottom: 2px solid var(--color-accent);
    padding-bottom: 24px;
    margin-bottom: 32px;
  }
  .header-title {
    font-size: 28px;
    font-weight: 800;
    color: var(--color-accent);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .header-subtitle {
    font-size: 14px;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  /* Table and data grids */
  .meta-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 13px;
  }
  .meta-table td {
    padding: 8px 12px;
    border: 1px solid var(--color-border);
  }
  .meta-table .meta-label {
    background: var(--color-bg-alt);
    font-weight: 600;
    color: var(--color-text-secondary);
    width: 25%;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 20px;
    table-layout: auto;
  }
  .data-table th, .data-table td {
    text-align: left;
    padding: 10px 12px;
    border: 1px solid var(--color-border);
    vertical-align: top;
    word-break: normal;
    overflow-wrap: break-word;
  }
  .data-table th {
    background: var(--color-bg-alt);
    font-weight: 600;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11px;
  }
  .data-table tr:hover td {
    background: var(--color-bg-alt);
  }

  /* Shared generic tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 16px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    vertical-align: top;
    word-break: normal;
    overflow-wrap: break-word;
  }
  th {
    background: var(--color-bg-alt);
    font-weight: 600;
    color: var(--color-text-secondary);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  tr:nth-child(even) { background: var(--color-bg-alt); }

  /* Sections */
  .section {
    margin-bottom: 36px;
  }
  .section h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--color-accent);
    border-bottom: 1px solid var(--color-border);
    padding-bottom: 8px;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .section h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--color-primary-light);
    margin-top: 24px;
    margin-bottom: 12px;
  }

  /* Workspace specific */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--color-primary);
  }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-secondary);
    margin-top: 4px;
  }
  .toc {
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 30px;
  }
  .toc h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--color-text-secondary);
  }
  .toc ol { padding-left: 20px; }
  .toc li {
    font-size: 13px;
    margin-bottom: 4px;
    color: var(--color-primary-light);
  }

  /* Badges and formatting */
  .badge-ai {
    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    margin-right: 8px;
    vertical-align: middle;
    border: 1px solid #fcd34d;
  }
  .badge-evidence {
    display: inline-block;
    background: #e0f2fe;
    color: #075985;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    margin-right: 8px;
    vertical-align: middle;
    border: 1px solid #bae6fd;
  }
  .badge-confidence {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
  }
  .conf-high { color: #059669; background: #d1fae5; border-color: #a7f3d0; }
  .conf-medium { color: #d97706; background: #fef3c7; border-color: #fde68a; }
  .conf-low { color: #dc2626; background: #fee2e2; border-color: #fecaca; }

  /* Cards and blocks */
  .ai-block {
    background: #fdf8f6;
    border-left: 3px solid #d97706;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .ai-block p { margin-bottom: 8px; }
  .ai-block p:last-child { margin-bottom: 0; }

  .finding-card {
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .finding-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
  }
  .note-card {
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-primary-light);
    padding: 14px 18px;
    margin-bottom: 12px;
    font-style: italic;
    color: var(--color-text-secondary);
  }
  .code-val {
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    background: var(--color-bg-alt);
    padding: 2px 4px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-size: 11px;
    word-break: break-all;
  }

  .entity-group { margin-bottom: 24px; }
  .entity-group h4 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--color-primary-light);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .methodology-list, .caveats-list {
    padding-left: 20px;
    margin-bottom: 16px;
  }
  .methodology-list li, .caveats-list li { margin-bottom: 8px; }

  .footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
    font-size: 11px;
    color: var(--color-text-muted);
    text-align: center;
  }
  
  .page-break { page-break-before: always; }

  /* Print Specific Styles */
  @media print {
    body { font-size: 12px; }
    .report-container { padding: 20px; max-width: 100%; margin: 0; }
    
    /* Layout preservation */
    .section { page-break-inside: avoid; margin-bottom: 24px; }
    h2, h3, h4 { page-break-after: avoid; }
    .toc { page-break-after: always; }
    
    /* Table protection */
    table, .data-table { page-break-inside: auto; width: 100%; table-layout: fixed; }
    table tr, .data-table tr { page-break-inside: avoid; page-break-after: auto; }
    table th, table td, .data-table th, .data-table td { 
      word-wrap: break-word; 
      overflow-wrap: break-word;
    }
    thead { display: table-header-group; }
    tfoot { display: table-footer-group; }
    
    /* Colors and background preservation in webkit print */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    
    .page-break { page-break-before: always; }
  }
</style>
